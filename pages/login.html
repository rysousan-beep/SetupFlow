
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | SetupFlow! Tech</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="../style/login.css">

    <!-- JavaScript -->
    <script src="../js/login.js" defer></script>

</head>

<body>

    <!--=========================================
        HEADER
    ==========================================-->

    <header id="header">

        <div class="header-container">

            <div class="logo-area">

                <img
                    id="logo"
                    src=""
                    alt="Logo">

                <h2 id="empresaNome"></h2>

            </div>

            <nav class="menu">

                <a
                    id="menuEntrar"
                    href="login.html">
                </a>

                <a
                    id="menuCadastro"
                    href="/pages/cadastro.html">
                </a>

            </nav>

        </div>

    </header>

    <!--=========================================
        CONTEÚDO PRINCIPAL
    ==========================================-->

    <main id="main">

        <!-- Banner -->

        <section id="banner"></section>

        <!-- Login -->

        <section id="login">

            <div id="login-container">

                <div id="login-topo">

                    <h1 id="tituloLogin"></h1>

                    <p id="descricaoLogin"></p>

                </div>

                <form id="formLogin"
                      autocomplete="off">

                    <div class="campo">

                        <label
                            id="labelEmail"
                            for="email">
                        </label>

                        <input
                            id="email"
                            type="email"
                            placeholder="">

                    </div>

                    <div class="campo">

                        <label
                            id="labelSenha"
                            for="senha">
                        </label>

                        <input
                            id="senha"
                            type="password"
                            placeholder="">

                    </div>

                    <div id="mensagem"></div>

                </form>

                <div id="login-botoes">

                    <button
                        id="btnEntrar"
                        type="button">
                    </button>

                    <button
                        id="btnCadastrar"
                        type="button">
                    </button>

                </div>

            </div>

        </section>

        <!-- Benefícios -->

        <section id="beneficios">

            <div id="beneficios-container">

                <div class="card-beneficio">

                    <img
                        id="icone1"
                        src=""
                        alt="">

                    <h3 id="tituloCard1"></h3>

                    <p id="descricaoCard1"></p>

                    <strong id="destaqueCard1"></strong>

                </div>

                <div class="card-beneficio">

                    <img
                        id="icone2"
                        src=""
                        alt="">

                    <h3 id="tituloCard2"></h3>

                    <p id="descricaoCard2"></p>

                    <strong id="destaqueCard2"></strong>

                </div>

            </div>

        </section>

    </main>

    <!--=========================================
        FOOTER
    ==========================================-->

    <footer id="footer">

        <div class="footer-container">

            <span id="copyright"></span>

            <a
                id="linkPrivacidade"
                href="#">
            </a>

        </div>

    </footer>

</body>

</html>
